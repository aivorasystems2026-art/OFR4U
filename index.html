<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Offer4u — Great Deals, Everyday Essentials</title>

<!-- iOS "Add to Home Screen" support: makes the site behave like a
     native app (own icon, no Safari address bar) when saved from iPhone -->

<style>
  :root{
    --green-deep:#123A2B;
    --green-mid:#1F5B44;
    --green-soft:#E9F1EC;
    --mustard:#E3A63A;
    --orange:#D9701E;
    --cream:#FBF6EC;
    --ink:#1A1A17;
    --ink-soft:#5C5A52;
    --line:#E4DCC9;
    --radius:16px;
    --shadow:0 6px 20px rgba(18,58,43,0.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button, a, input, select, textarea{touch-action:manipulation;}
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:#fff;
    color:var(--ink);
    padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 14px rgba(0,0,0,0.08);
  }
  .header-logo-img{
    height:60px;width:auto;display:block;
  }

  /* ---------- Hero / Offers ---------- */
  .shop-banner{
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:18px 20px 6px;text-align:center;background:var(--cream);
  }
  .shop-banner.visible{display:flex;}
  .shop-banner-logo{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--mustard),var(--orange));
    color:var(--green-deep);display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:20px;
    box-shadow:0 4px 14px rgba(217,112,30,0.3);
    overflow:hidden;
  }
  .shop-banner-logo img{
    width:100%;height:100%;object-fit:cover;object-position:center;
  }
  .shop-banner-name{
    font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--green-deep);
  }
  .hero{
    padding:28px 20px 22px;
    background:radial-gradient(circle at 20% 0%,#1F5B44,#123A2B 65%);
    color:#fff;
  }
  .hero-eyebrow{
    font-size:12px;text-transform:uppercase;letter-spacing:0.12em;
    color:var(--mustard);font-weight:600;margin-bottom:6px;
  }
  .hero h2{color:#fff;font-size:24px;margin:0 0 4px;}
  .hero p.sub{color:#CFE2D8;margin:0;font-size:14px;}

  /* ---------- Sections ---------- */
  main{max-width:640px;margin:0 auto;padding:0 20px 100px;}
  .section-title{
    font-size:20px;margin:34px 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--orange);display:inline-block;
  }

  /* Category tabs */
  .search-box{
    position:relative;margin-bottom:14px;
  }
  .search-box .search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:0.6;pointer-events:none;
  }
  .search-box input{
    width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);
    border-radius:10px;font-family:'Inter',sans-serif;font-size:16px;
    background:#fff;color:var(--ink);box-shadow:var(--shadow);
  }
  .search-box input:focus{outline:2px solid var(--green-mid);outline-offset:1px;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .shop-dropdown{position:relative;margin-bottom:16px;}
  .shop-dropdown-trigger{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);cursor:pointer;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--ink);
    text-align:left;
  }
  .shop-dropdown-trigger #triggerLabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .shop-dropdown-arrow{color:var(--ink-soft);font-size:12px;transition:transform .18s ease;flex-shrink:0;}
  .shop-dropdown.open .shop-dropdown-arrow{transform:rotate(180deg);}
  .shop-dropdown-panel{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 34px rgba(18,58,43,0.18);
    max-height:280px;overflow-y:auto;padding:8px;
    display:none;
  }
  .shop-dropdown.open .shop-dropdown-panel{display:block;}
  .shop-list-item{
    display:flex;align-items:center;gap:12px;
    border-radius:10px;padding:9px 10px;cursor:pointer;transition:background .12s ease;
  }
  .shop-list-item:hover, .shop-list-item:active{background:var(--green-soft);}
  .shop-list-item.selected{background:var(--green-soft);}
  .shop-list-logo{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--mustard),var(--orange));
    color:var(--green-deep);display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:13px;overflow:hidden;
  }
  .shop-list-logo img{width:100%;height:100%;object-fit:cover;object-position:center;}
  .shop-list-text{flex:1;min-width:0;}
  .shop-list-name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .shop-list-meta{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .shop-list-check{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:transparent;
  }
  .shop-list-item.selected .shop-list-check{
    background:var(--green-mid);border-color:var(--green-mid);color:#fff;
  }
  .tab-btn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:#fff;
    padding:6px 16px 6px 8px;border-radius:999px;font-size:13.5px;
    font-weight:600;color:var(--ink-soft);cursor:pointer;
    transition:all .18s ease;
  }
  .tab-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    background:var(--green-soft);color:var(--green-mid);flex-shrink:0;
    transition:background .18s ease;
  }
  .tab-icon svg{width:14px;height:14px;}
  .tab-btn.active .tab-icon{background:rgba(255,255,255,0.2);color:#fff;}
  .tab-btn.active{
    background:var(--green-deep);color:#fff;border-color:var(--green-deep);
  }
  .tab-btn:hover{border-color:var(--green-mid);}
  .tab-btn:active{transform:scale(0.96);}

  /* Item cards */
  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:420px){.item-grid{grid-template-columns:1fr 1fr;gap:10px;}}
  .item-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);text-align:left;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .item-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(18,58,43,0.12);}
  .item-card:active{transform:scale(0.98);}
  .item-img-wrap{
    position:relative;width:100%;height:0;padding-top:100%;
    background:#F7F5EE;cursor:pointer;
  }
  .item-img{
    position:absolute;top:10px;left:10px;right:10px;bottom:10px;
    width:calc(100% - 20px);height:calc(100% - 20px);
    object-fit:contain;object-position:center;display:block;
  }
  .item-img-placeholder{
    position:absolute;top:10px;left:10px;right:10px;bottom:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--green-mid);font-family:'Fraunces',serif;font-weight:700;font-size:30px;
    opacity:0.5;
  }
  .item-chip{
    position:absolute;left:8px;bottom:8px;
    background:#fff;border:1px solid var(--line);border-radius:7px;
    font-size:10.5px;font-weight:700;color:var(--ink-soft);
    padding:3px 7px;text-transform:capitalize;
  }
  .item-details{padding:10px 12px 14px;}
  .item-unit-price{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:2px;}
  .item-shop-block{
    border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;
  }
  .item-shop-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--green-mid);font-weight:700;margin-bottom:2px;
  }
  .item-shop-meta{font-size:10.5px;color:var(--ink);font-weight:600;line-height:1.5;}

  /* ---------- Item detail modal ---------- */
  .item-modal-overlay{
    position:fixed;inset:0;background:rgba(18,58,43,0.55);
    display:none;align-items:flex-end;justify-content:center;
    z-index:200;padding:0;
  }
  .item-modal-overlay.open{display:flex;}
  @media(min-width:520px){
    .item-modal-overlay{align-items:center;padding:20px;}
  }
  .item-modal-card{
    background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:420px;
    max-height:88vh;overflow-y:auto;position:relative;
    box-shadow:0 -10px 40px rgba(0,0,0,0.3);
    animation:modalSlideUp .22s ease;
  }
  @media(min-width:520px){
    .item-modal-card{border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
  }
  @keyframes modalSlideUp{
    from{transform:translateY(24px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  .item-modal-close{
    position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
    background:#fff;border:1px solid var(--line);font-size:14px;cursor:pointer;z-index:2;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .item-modal-img-wrap{
    position:relative;width:100%;height:0;padding-top:75%;
    background:#F7F5EE;border-radius:20px 20px 0 0;overflow:hidden;
  }
  .item-modal-img-wrap img, .item-modal-img-wrap .item-img-placeholder{
    position:absolute;top:20px;left:20px;right:20px;bottom:20px;
    width:calc(100% - 40px);height:calc(100% - 40px);
    object-fit:contain;object-position:center;
  }
  .item-modal-img-wrap .item-img-placeholder{
    display:flex;align-items:center;justify-content:center;
    color:var(--green-mid);font-family:'Fraunces',serif;font-weight:700;font-size:44px;opacity:0.5;
  }
  .item-modal-details{padding:18px 20px 26px;}
  .item-modal-details .price{font-size:22px;}
  .item-modal-details h3{font-size:18px;margin:6px 0 8px;}
  .item-modal-details .item-desc{font-size:13px;margin-top:8px;}
  .item-modal-details .item-shop-block{margin-top:14px;padding-top:12px;}
  .item-card .cat-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--ink-soft);font-weight:600;margin-bottom:3px;
  }
  .offer-type-badge{
    display:block;font-size:12px;font-weight:700;color:#1A73E8;margin:3px 0 4px;
  }
  .price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
  .item-card .price{font-size:16px;font-weight:800;color:var(--ink);}
  .mrp{font-size:11.5px;color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1.5px;}
  .item-card h3{font-size:13.5px;font-weight:600;margin:0 0 3px;color:var(--ink);line-height:1.3;}
  .item-card .item-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .empty-state, .loading-state{
    text-align:center;padding:30px 14px;color:var(--ink-soft);
    font-size:13.5px;border:1px dashed var(--line);border-radius:var(--radius);
    background:#fff;
  }

  /* Contact */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.contact-grid{grid-template-columns:1fr;}}
  .contact-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;text-decoration:none;display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow);transition:transform .15s ease;
  }
  .contact-card:hover{transform:translateY(-2px);}
  .contact-card:active{transform:scale(0.97);}
  .contact-icon{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--green-soft);color:var(--green-deep);font-size:18px;
  }
  .contact-card .c-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .contact-card .c-value{font-size:13.5px;font-weight:700;color:var(--ink);}

  /* Footer */
  footer{
    background:var(--green-deep);color:#CFE2D8;
    text-align:center;padding:22px 20px calc(22px + env(safe-area-inset-bottom));font-size:12.5px;
  }
  footer .timing{color:var(--mustard);font-weight:700;margin-bottom:4px;font-size:13.5px;}
  footer .credit{margin-top:10px;opacity:0.6;font-size:11px;}
</style>
</head>

        <div><div class="c-label">WhatsApp</div><div class="c-value" id="waValue">—</div></div>
      </a>
      <a class="contact-card" id="addrCard" href="#" target="_blank" rel="noopener" style="grid-column:1/-1;">
        <div class="contact-icon">📍</div>
        <div><div class="c-label">Address</div><div class="c-value" id="addrValue">—</div></div>
      </a>
    </div>
  </div>
</main>

<!-- Item detail modal, opened by tapping an item's image -->
<div class="item-modal-overlay" id="itemModalOverlay" onclick="if(event.target===this) closeItemDetail()">
  <div class="item-modal-card">
    <button type="button" class="item-modal-close" onclick="closeItemDetail()">✕</button>
    <div class="item-modal-img-wrap" id="modalImgWrap"></div>
    <div class="item-modal-details" id="modalDetails"></div>
  </div>
</div>

<footer>
  <div>Offer4u — a directory of local shops</div>
  <div class="credit">Powered by Offer4u</div>
</footer>

<script>
  // =========================================================
  // 1) PASTE YOUR SUPABASE PROJECT DETAILS HERE
  //    Get these from: Supabase Dashboard → Project Settings → API
  // =========================================================
  const SUPABASE_URL = "https://zxrlbenaxmjsfgexpkup.supabase.co";      // e.g. https://xxxxx.supabase.co
  const SUPABASE_ANON_KEY = "sb_publishable_LsIi7VlsX2mRc6biHqgnZg_2aXDJOsL";    // the "anon public" key

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentShopName = null; // which shop's offers/items are currently shown
  let allShops = [];

  // ---------- Load list of registered shops ----------
  async function loadShops(){
    const bar = document.getElementById('shopTabBar');
    try{
      const { data, error } = await sb.from('shop_profile').select('shop_name, district, address, phone, shoplogo').order('shop_name', { ascending:true });
      if (error) throw error;
      if (!data || data.length === 0){
        bar.innerHTML = `<div class="loading-state">No shops registered yet.</div>`;
        return;
      }
      allShops = data;
      currentShopName = 'ALL';
      renderShopTabBar();

      updateContactInfo(currentShopName);
      updateShopBanner(currentShopName);
      loadItems();
    }catch(e){
      bar.innerHTML = `<div class="loading-state">Couldn't load shops. Check Supabase config.</div>`;
      console.error(e);
    }
  }

  // Renders "All Shops" plus every registered shop as a tappable list row
  // with a small logo, name, and district — highlights the selected one.
  function renderShopTabBar(){
    const bar = document.getElementById('shopTabBar');
    const allRow = `
      <div class="shop-list-item${currentShopName === 'ALL' ? ' selected' : ''}" data-shop="ALL">
        <div class="shop-list-logo">🏬</div>
        <div class="shop-list-text">
          <div class="shop-list-name">All Shops</div>
          <div class="shop-list-meta">Browse every registered shop</div>
        </div>
        <div class="shop-list-check">✓</div>
      </div>`;
    const shopRows = allShops.map(s => {
      const words = s.shop_name.trim().split(/\s+/);
      const initials = words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : s.shop_name.slice(0, 2).toUpperCase();
      const logoInner = s.shoplogo
        ? `<img src="${escapeHtml(s.shoplogo)}" alt="${escapeHtml(s.shop_name)}" onerror="this.parentElement.innerHTML='${initials}'">`
        : initials;
      return `
      <div class="shop-list-item${currentShopName === s.shop_name ? ' selected' : ''}" data-shop="${escapeHtml(s.shop_name)}">
        <div class="shop-list-logo">${logoInner}</div>
        <div class="shop-list-text">
          <div class="shop-list-name">${escapeHtml(s.shop_name)}</div>
          <div class="shop-list-meta">${escapeHtml(s.district || '')}</div>
        </div>
        <div class="shop-list-check">✓</div>
      </div>`;
    }).join('');
    bar.innerHTML = allRow + shopRows;
    updateShopTrigger();
  }

  // Reflects the current selection on the collapsed dropdown trigger
  // (logo + name), so it looks right even before the panel is opened.
  function updateShopTrigger(){
    const logoEl = document.getElementById('triggerLogo');
    const labelEl = document.getElementById('triggerLabel');
    if (currentShopName === 'ALL'){
      logoEl.innerHTML = '🏬';
      labelEl.textContent = 'All Shops';
      return;
    }
    const shop = allShops.find(s => s.shop_name === currentShopName);
    if (!shop) return;
    const words = shop.shop_name.trim().split(/\s+/);
    const initials = words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : shop.shop_name.slice(0, 2).toUpperCase();
    logoEl.innerHTML = shop.shoplogo
      ? `<img src="${escapeHtml(shop.shoplogo)}" alt="${escapeHtml(shop.shop_name)}" onerror="this.parentElement.innerHTML='${initials}'">`
      : initials;
    labelEl.textContent = shop.shop_name;
  }

  function updateShopBanner(shopName){
    const banner = document.getElementById('shopBanner');
    if (shopName === 'ALL'){
      banner.classList.remove('visible');
      return;
    }
    const shop = allShops.find(s => s.shop_name === shopName);
    if (!shop){ banner.classList.remove('visible'); return; }

    const logoEl = document.getElementById('shopBannerLogo');
    if (shop.shoplogo){
      logoEl.innerHTML = `<img src="${escapeHtml(shop.shoplogo)}" alt="${escapeHtml(shop.shop_name)}" onerror="this.parentElement.textContent=this.parentElement.dataset.fallback">`;
    } else {
      const words = shop.shop_name.trim().split(/\s+/);
      const initials = words.length > 1
        ? (words[0][0] + words[1][0]).toUpperCase()
        : shop.shop_name.slice(0, 2).toUpperCase();
      logoEl.dataset.fallback = initials;
      logoEl.textContent = initials;
    }
    document.getElementById('shopBannerName').textContent = shop.shop_name;
    banner.classList.add('visible');
  }

  function updateContactInfo(shopName){
    const contactSection = document.getElementById('contactSection');
    if (shopName === 'ALL'){
      contactSection.style.display = 'none';
      return;
    }
    contactSection.style.display = 'block';
    const shop = allShops.find(s => s.shop_name === shopName);
    document.getElementById('contactShopName').textContent = shop ? '— ' + shop.shop_name : '';
    if (!shop) return;
    const cleanPhone = (shop.phone || '').replace(/\s+/g,'');
    document.getElementById('callCard').href = `tel:${cleanPhone}`;
    document.getElementById('callValue').textContent = shop.phone || '—';
    document.getElementById('waCard').href = `https://wa.me/91${cleanPhone}`;
    document.getElementById('waValue').textContent = shop.phone || '—';
    const fullAddress = `${shop.address || ''} ${shop.district || ''}`.trim();
    document.getElementById('addrCard').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddress)}`;
    document.getElementById('addrValue').textContent = fullAddress || '—';
  }

  document.getElementById('shopTabBar').addEventListener('click', (e) => {
    const row = e.target.closest('.shop-list-item');
    if (!row) return;
    currentShopName = row.dataset.shop;
    renderShopTabBar();
    updateContactInfo(currentShopName);
    updateShopBanner(currentShopName);
    loadItems();
    document.getElementById('shopDropdown').classList.remove('open');
  });

  document.getElementById('shopDropdownTrigger').addEventListener('click', () => {
    document.getElementById('shopDropdown').classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('shopDropdown');
    if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
  });

  // ---------- Load Items (for the currently selected shop, or all) ----------
  let allItems = [];
  async function loadItems(){
    const grid = document.getElementById('itemGrid');
    if (!currentShopName) return;
    grid.innerHTML = `<div class="loading-state" style="grid-column:1/-1;">Loading items…</div>`;
    try{
      let query = sb.from('items').select('*').order('category', { ascending:true });
      if (currentShopName !== 'ALL') query = query.eq('shop_name', currentShopName);
      const { data, error } = await query;
      if (error) throw error;
      allItems = data || [];
      const activeTab = document.querySelector('#tabBar .tab-btn.active');
      renderItems(activeTab ? activeTab.dataset.cat : 'all');
    }catch(e){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Couldn't load items. Check Supabase config.</div>`;
      console.error(e);
    }
  }

  function renderItems(filter){
    const grid = document.getElementById('itemGrid');
    let filtered = filter === 'all' ? allItems : allItems.filter(i => (i.category || '').toLowerCase() === filter);

    const searchTerm = document.getElementById('itemSearch').value.trim().toLowerCase();
    if (searchTerm){
      filtered = filtered.filter(i =>
        (i.name || '').toLowerCase().includes(searchTerm) ||
        (i.description || '').toLowerCase().includes(searchTerm)
      );
    }

    if (filtered.length === 0){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${searchTerm ? 'No items match your search.' : 'No items added yet in this category.'}</div>`;
      return;
    }
    grid.innerHTML = filtered.map(i => {
      const shop = allShops.find(s => s.shop_name === i.shop_name);
      const shopAddress = shop ? `${shop.address || ''}${shop.district ? ', ' + shop.district : ''}`.trim() : '';
      const unitRate = (i.offerprice && i.weight) ? (i.offerprice / i.weight) : null;
      const unitRateLabel = unitRate ? `₹${Number.isInteger(unitRate) ? unitRate : unitRate.toFixed(2)}/${i.unitofmeasure || ''}` : '';
      return `
      <div class="item-card">
        <div class="item-img-wrap" onclick="openItemDetail('${i.id}')">
          ${i.itemimage
            ? `<img class="item-img" src="${escapeHtml(i.itemimage)}" alt="${escapeHtml(i.name)}" data-fallback="${escapeHtml((i.category || '?').charAt(0).toUpperCase())}" onerror="onItemImgError(this)">`
            : `<div class="item-img-placeholder">${escapeHtml((i.category || '?').charAt(0).toUpperCase())}</div>`}
          <span class="item-chip">${i.weight ? escapeHtml(String(i.weight)) + ' ' + escapeHtml(i.unitofmeasure || '') : escapeHtml(i.category || '')}</span>
        </div>
        <div class="item-details">
          ${unitRateLabel ? `<div class="item-unit-price">${escapeHtml(unitRateLabel)}</div>` : ''}
          <div class="price-row">
            ${i.offerprice ? `<span class="price">₹${escapeHtml(String(i.offerprice))}</span>` : ''}
            ${i.mrp ? `<span class="mrp">₹${escapeHtml(String(i.mrp))}</span>` : ''}
          </div>
          ${i.offertype ? `<div class="offer-type-badge">${escapeHtml(i.offertype)}</div>` : ''}
          <h3>${escapeHtml(i.name)}</h3>
          ${i.description ? `<div class="item-desc">${escapeHtml(i.description)}</div>` : ''}
          <div class="item-shop-block">
            <div class="item-shop-label">${escapeHtml(i.shop_name || '')}</div>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }


  // If an item's image URL fails to load (broken link, permission issue,
  // expired signed URL, etc), swap it for the same placeholder block
  // instead of leaving a broken image icon.
  function onItemImgError(imgEl){
    const div = document.createElement('div');
    div.className = 'item-img item-img-placeholder';
    div.textContent = imgEl.dataset.fallback || '?';
    imgEl.replaceWith(div);
  }

  // ---------- Item detail modal ----------
  function openItemDetail(id){
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    const shop = allShops.find(s => s.shop_name === item.shop_name);
    const shopAddress = shop ? `${shop.address || ''}${shop.district ? ', ' + shop.district : ''}`.trim() : '';
    const fallbackLetter = escapeHtml((item.category || '?').charAt(0).toUpperCase());

    document.getElementById('modalImgWrap').innerHTML = item.itemimage
      ? `<img src="${escapeHtml(item.itemimage)}" alt="${escapeHtml(item.name)}" data-fallback="${fallbackLetter}" onerror="onItemImgError(this)">`
      : `<div class="item-img-placeholder">${fallbackLetter}</div>`;

    document.getElementById('modalDetails').innerHTML = `
      ${item.offertype ? `<div class="offer-type-badge">${escapeHtml(item.offertype)}</div>` : ''}
      <div class="price-row">
        ${item.offerprice ? `<span class="price">₹${escapeHtml(String(item.offerprice))}</span>` : ''}
        ${item.mrp ? `<span class="mrp">₹${escapeHtml(String(item.mrp))}</span>` : ''}
      </div>
      <h3>${escapeHtml(item.name)}</h3>
      ${item.weight ? `<div class="item-shop-meta">Qty: ${escapeHtml(String(item.weight))} ${escapeHtml(item.unitofmeasure || '')}</div>` : ''}
      ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
      <div class="item-shop-block">
        <div class="item-shop-label">${escapeHtml(item.shop_name || '')}</div>
        ${shopAddress ? `<div class="item-shop-meta">📍 ${escapeHtml(shopAddress)}</div>` : ''}
        ${shop && shop.phone ? `<div class="item-shop-meta">📞 ${escapeHtml(shop.phone)}</div>` : ''}
      </div>
    `;

    document.getElementById('itemModalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeItemDetail(){
    document.getElementById('itemModalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeItemDetail();
  });

  document.getElementById('tabBar').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderItems(btn.dataset.cat);
  });

  document.getElementById('itemSearch').addEventListener('input', () => {
    const activeTab = document.querySelector('#tabBar .tab-btn.active');
    renderItems(activeTab ? activeTab.dataset.cat : 'all');
  });

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  loadShops();
</script>

</body>
</html>
